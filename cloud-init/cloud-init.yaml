#cloud-config
package_update: true
packages: [ca-certificates, curl, git, jq]
write_files:
  - path: /etc/coachos/deploy-authorized-key
    permissions: '0600'
    content: ${deploy_user_public_key}
runcmd:
  - install -d -m 0750 /opt/coachos /opt/coachos/data /opt/coachos/backups /etc/coachos
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
