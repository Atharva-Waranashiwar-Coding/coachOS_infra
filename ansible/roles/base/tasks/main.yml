- name: Install base operating-system packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - chrony
      - curl
      - fail2ban
      - git
      - gnupg
      - jq
      - python3
      - python3-pip
      - python3-venv
      - restic
      - unattended-upgrades
      - unzip
      - ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable time synchronization
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Create an isolated OCI CLI virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv /opt/oci-cli
    creates: /opt/oci-cli/bin/python

- name: Install OCI CLI
  ansible.builtin.pip:
    name: oci-cli
    virtualenv: /opt/oci-cli
    state: present

- name: Expose OCI CLI on the system path
  ansible.builtin.file:
    src: /opt/oci-cli/bin/oci
    dest: /usr/local/bin/oci
    state: link
