events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    server_tokens off;

    upstream frontend_upstream { server frontend:80; }
    upstream auth_upstream { server auth-service:8000; }
    upstream athlete_upstream { server athlete-service:8000; }
    upstream media_upstream { server media-service:8000; }
    upstream ai_review_upstream { server ai-review-service:8000; }
    upstream assistant_upstream { server assistant-service:8000; }

    server {
        listen 80;
        listen [::]:80;
        server_name coachosapp.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/auth/ {
            proxy_pass http://auth_upstream/;
            include /etc/nginx/proxy-common.conf;
        }

        location /api/athletes/ {
            proxy_pass http://athlete_upstream/;
            include /etc/nginx/proxy-common.conf;
        }

        location /api/media/ {
            client_max_body_size 2G;
            proxy_pass http://media_upstream/;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/reviews/ {
            proxy_pass http://ai_review_upstream/;
            include /etc/nginx/proxy-common.conf;
        }

        # The current frontend uses this path; retain it during the API-prefix
        # migration so existing Assistant UI builds continue to work.
        location /assistant-api/ {
            proxy_pass http://assistant_upstream/;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/assistant/ {
            proxy_pass http://assistant_upstream/;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
