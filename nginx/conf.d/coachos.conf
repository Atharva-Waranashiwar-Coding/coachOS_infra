# Canonical production virtual host. Mount this together with snippets/.
include /etc/nginx/snippets/security.conf;
include /etc/nginx/snippets/rate-limit.conf;
server {
  listen 8080;
  server_name _;
  location / { proxy_pass http://frontend:8080; include /etc/nginx/snippets/proxy.conf; }
  location /auth-api/ { proxy_pass http://auth-service:8000/; include /etc/nginx/snippets/proxy.conf; }
  location /athlete-api/ { proxy_pass http://athlete-service:8000/; include /etc/nginx/snippets/proxy.conf; }
  location /media-api/ { proxy_pass http://media-service:8000/; include /etc/nginx/snippets/proxy.conf; }
  location /ai-review-api/ { proxy_pass http://ai-review-service:8000/; include /etc/nginx/snippets/proxy.conf; }
  location /assistant-api/ { proxy_pass http://assistant-service:8000/; include /etc/nginx/snippets/proxy.conf; }
}
