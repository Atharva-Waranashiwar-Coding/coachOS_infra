limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

map $http_x_request_id $coachos_request_id {
    default $http_x_request_id;
    "" $request_id;
}

server {
    listen 80;
    server_name app.coachos.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.coachos.example;

    ssl_certificate /etc/letsencrypt/live/app.coachos.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.coachos.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 2g;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health/live {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"nginx"}';
    }

    location = /nginx_status {
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        stub_status;
    }

    location / {
        proxy_pass http://frontend:80;
        include /etc/nginx/proxy-common.conf;
        proxy_set_header X-Request-ID $coachos_request_id;
    }

    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://auth-service:8000/;
        include /etc/nginx/proxy-common.conf;
        proxy_set_header X-Request-ID $coachos_request_id;
    }

    location /api/athletes/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://athlete-service:8000/;
        include /etc/nginx/proxy-common.conf;
        proxy_set_header X-Request-ID $coachos_request_id;
    }

    location /api/media/ {
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_pass http://media-service:8000/;
        include /etc/nginx/proxy-common.conf;
        proxy_set_header X-Request-ID $coachos_request_id;
    }

    location /api/reviews/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://ai-review-service:8000/;
        include /etc/nginx/proxy-common.conf;
        proxy_set_header X-Request-ID $coachos_request_id;
    }

    location /assistant-api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_read_timeout 180;
        proxy_pass http://assistant-service:8000/;
        include /etc/nginx/proxy-common.conf;
        proxy_set_header X-Request-ID $coachos_request_id;
    }
}
